[project]
name = "uidss-sdk"
version = "0.1.0"
description = "Ground station SDK and CLI for AutoAssess — downloads inspection plans and uploads mission artifacts to CDF."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cognite-sdk>=7",
    "typer>=0.12",
    "questionary>=2.0",
    "rich>=13",
    "pydantic>=2",
    "pydantic-settings>=2",
    "structlog>=24",
    "tenacity>=8",
    "pyyaml>=6",
]

[project.scripts]
dss = "uidss.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.9",
    "ty>=0.0.1a6",
]

[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "ANN", "B", "A", "C4", "SIM", "RUF", "S"]
ignore = ["S101"]
per-file-ignores = { "tests/**/*.py" = ["ANN", "S", "E501"], "src/uidss/cli/main.py" = ["B008"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uidss"]
