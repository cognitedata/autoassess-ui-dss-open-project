1="326" y1="170" x2="545" y2="170"/><path class="headfill" d="M554,170 l-11,-5.5 v11 z"/><text class="lbl" x="440.0" y="162" text-anchor="middle"><tspan class="num">2  </tspan>InspectionPlan <tspan class="mono">Draft</tspan></text><line class="msg" x1="96" y1="200" x2="305" y2="200"/><path class="headfill" d="M314,200 l-11,-5.5 v11 z"/><text class="lbl" x="205.0" y="192" text-anchor="middle"><tspan class="num">3  </tspan>Add tasks in 3D</text><line class="msg" x1="326" y1="230" x2="545" y2="230"/><path class="headfill" d="M554,230 l-11,-5.5 v11 z"/><text class="lbl" x="440.0" y="222" text-anchor="middle"><tspan class="num">4  </tspan>InspectionTask nodes</text><line class="msg" x1="96" y1="260" x2="305" y2="260"/><path class="headfill" d="M314,260 l-11,-5.5 v11 z"/><text class="lbl" x="205.0" y="252" text-anchor="middle"><tspan class="num">5  </tspan>Mark <tspan class="mono">Ready</tspan></text><line class="msg" x1="326" y1="290" x2="545" y2="290"/><path class="headfill" d="M554,290 l-11,-5.5 v11 z"/><text class="lbl" x="440.0" y="282" text-anchor="middle"><tspan class="num">6  </tspan>plan.status = <tspan class="mono">Ready</tspan></text><line class="msg" x1="804" y1="334" x2="575" y2="334"/><path class="headfill" d="M566,334 l11,-5.5 v11 z"/><text class="lbl" x="685.0" y="326" text-anchor="middle"><tspan class="num">7  </tspan>fetch Ready plan + reference map</text><line class="ret" x1="566" y1="364" x2="795" y2="364"/><path class="ret" style="stroke-dasharray:none" d="M793,358 L804,364 L793,370"/><text class="lbl" x="685.0" y="356" text-anchor="middle"><tspan class="num">8  </tspan><tspan class="mono">plan.json</tspan>, <tspan class="mono">.ply</tspan> / <tspan class="mono">.pcd</tspan></text><path class="msg" d="M816,388 h30 v18 h-20"/><path class="headfill" d="M816,406 l11,-5.5 v11 z"/><text class="lbl" x="796" y="401" text-anchor="end"><tspan class="num">9  </tspan>convert plan → drone mission</text><line class="msg" x1="816" y1="434" x2="1045" y2="434"/><path class="headfill" d="M1054,434 l-11,-5.5 v11 z"/><text class="lbl" x="935.0" y="426" text-anchor="middle"><tspan class="num">10  </tspan>send drone mission</text><line class="ret" x1="1054" y1="464" x2="825" y2="464"/><path class="ret" style="stroke-dasharray:none" d="M827,458 L816,464 L827,470"/><text class="lbl" x="935.0" y="456" text-anchor="middle"><tspan class="num">11  </tspan>accepted / pre-flight issues</text></svg>