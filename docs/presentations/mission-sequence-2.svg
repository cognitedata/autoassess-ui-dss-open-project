ted]</text><line class="msg" x1="816" y1="178" x2="1045" y2="178"/><path class="headfill" d="M1054,178 l-11,-5.5 v11 z"/><text class="lbl" x="935.0" y="170" text-anchor="middle"><tspan class="num">12  </tspan>start mission</text><text class="guard" x="758" y="211">[each task, in the drone's order]</text><path class="msg" d="M1066,240 h30 v18 h-20"/><path class="headfill" d="M1066,258 l11,-5.5 v11 z"/><text class="lbl" x="1046" y="253" text-anchor="end"><tspan class="num">13  </tspan>fly to pose, inspect</text><line class="ret" x1="1054" y1="286" x2="825" y2="286"/><path class="ret" style="stroke-dasharray:none" d="M827,280 L816,286 L827,292"/><text class="lbl" x="935.0" y="278" text-anchor="middle"><tspan class="num">14  </tspan>progress: inspected / skipped</text><g class="frame loop inner"><path style="fill:var(--panel, #fff)" d="M682,200 h58 v12 l-8,9 h-50 z"/></g><text class="tagtxt" x="690" y="215">loop</text><line class="ret" x1="1054" y1="332" x2="825" y2="332"/><path class="ret" style="stroke-dasharray:none" d="M827,326 L816,332 L827,338"/><text class="lbl" x="935.0" y="324" text-anchor="middle"><tspan class="num">15  </tspan>landed + mission folder</text><line class="msg" x1="804" y1="362" x2="575" y2="362"/><path class="headfill" d="M566,362 l11,-5.5 v11 z"/><text class="lbl" x="685.0" y="354" text-anchor="middle"><tspan class="num">16  </tspan><tspan class="mono">dss campaign upload</tspan></text><line class="ret" x1="566" y1="392" x2="795" y2="392"/><path class="ret" style="stroke-dasharray:none" d="M793,386 L804,392 L793,398"/><text class="lbl" x="685.0" y="384" text-anchor="middle"><tspan class="num">17  </tspan>campaign <tspan class="mono">InProgress</tspan> + files</text><text class="guard" x="508" y="425">[all tasks inspected]</text><line class="msg" x1="804" y1="460" x2="575" y2="460"/><path class="headfill" d="M566,460 l11,-5.5 v11 z"/><text class="lbl" x="685.0" y="452" text-anchor="middle"><tspan class="num">18  </tspan>both → <tspan class="mono">Complete</tspan></text><line class="sep" x1="432" y1="482" x2="908" y2="482"/><text class="guard" x="442" y="499">[tasks skipped]</text><line class="msg" x1="804" y1="524" x2="575" y2="524"/><path class="headfill" d="M566,524 l11,-5.5 v11 z"/><text class="lbl" x="685.0" y="516" text-anchor="middle"><tspan class="num">19  </tspan>campaign <tspan class="mono">Complete</tspan>, plan <tspan class="mono">Ready</tspan></text><g class="frame inner"><path style="fill:var(--panel, #fff)" d="M432,414 h58 v12 l-8,9 h-50 z"/></g><text class="tagtxt" x="440" y="429">alt</text><line class="sep" x1="8" y1="562" x2="1152" y2="562"/><text class="guard" x="18" y="579">[pre-flight issues]</text><line class="ret" x1="804" y1="604" x2="105" y2="604"/><path class="ret" style="stroke-dasharray:none" d="M107,598 L96,604 L107,610"/><text class="lbl" x="450.0" y="596" text-anchor="middle"><tspan class="num">20  </tspan>report issues</text><line class="msg" x1="96" y1="634" x2="305" y2="634"/><path class="headfill" d="M314,634 l-11,-5.5 v11 z"/><text class="lbl" x="205.0" y="626" text-anchor="middle"><tspan class="num">21  </tspan>Fix tasks in a new Draft plan</text><g class="frame"><path style="fill:var(--panel, #fff)" d="M8,132 h58 v12 l-8,9 h-50 z"/></g><text class="tagtxt" x="16" y="147">alt</text><line class="msg" x1="96" y1="688" x2="305" y2="688"/><path class="headfill" d="M314,688 l-11,-5.5 v11 z"/><text class="lbl" x="205.0" y="680" text-anchor="middle"><tspan class="num">22  </tspan>Review 3D, report, defects</text><line class="msg" x1="326" y1="718" x2="545" y2="718"/><path class="headfill" d="M554,718 l-11,-5.5 v11 z"/><text class="lbl" x="440.0" y="710" text-anchor="middle"><tspan class="num">23  </tspan>read campaign, stream 3D model</text></svg>