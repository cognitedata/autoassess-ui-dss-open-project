,-5.5 v11 z"/><text class="lbl" x="935.0" y="170" text-anchor="middle"><tspan class="num">10  </tspan><tspan class="mono">/gbplanner_path</tspan>, odometry, homing</text><line class="msg" x1="1054" y1="208" x2="825" y2="208"/><path class="headfill" d="M816,208 l11,-5.5 v11 z"/><text class="lbl" x="935.0" y="200" text-anchor="middle"><tspan class="num">11  </tspan><tspan class="mono">/autoassess/findings</tspan> (detections, JSON)</text><g class="frame loop"><path style="fill:var(--panel, #fff)" d="M660,132 h58 v12 l-8,9 h-50 z"/></g><text class="tagtxt" x="668" y="147">loop</text><path class="msg" d="M816,248 h30 v18 h-20"/><path class="headfill" d="M816,266 l11,-5.5 v11 z"/><text class="lbl" x="796" y="261" text-anchor="end"><tspan class="num">12  </tspan>mission end detected (homing + quiet + still)</text><line class="msg" x1="816" y1="294" x2="1045" y2="294"/><path class="headfill" d="M1054,294 l-11,-5.5 v11 z"/><text class="lbl" x="935.0" y="286" text-anchor="middle"><tspan class="num">13  </tspan><tspan class="mono">generate_mesh</tspan> → save map PLY</text><line class="msg" x1="804" y1="324" x2="575" y2="324"/><path class="headfill" d="M566,324 l11,-5.5 v11 z"/><text class="lbl" x="685.0" y="316" text-anchor="middle"><tspan class="num">14  </tspan>upload mesh + files (CogniteFiles)</text><line class="msg" x1="804" y1="354" x2="575" y2="354"/><path class="headfill" d="M566,354 l11,-5.5 v11 z"/><text class="lbl" x="685.0" y="346" text-anchor="middle"><tspan class="num">15  </tspan>create campaign → <tspan class="mono">Complete</tspan></text><line class="msg" x1="804" y1="384" x2="575" y2="384"/><path class="headfill" d="M566,384 l11,-5.5 v11 z"/><text class="lbl" x="685.0" y="376" text-anchor="middle"><tspan class="num">16  </tspan>create findings plan (<tspan class="mono">Draft</tspan>)</text><line class="msg" x1="804" y1="422" x2="575" y2="422"/><path class="headfill" d="M566,422 l11,-5.5 v11 z"/><text class="lbl" x="685.0" y="414" text-anchor="middle"><tspan class="num">17  </tspan>dss worker (ROS-launched): build 3D models</text><line class="msg" x1="96" y1="460" x2="305" y2="460"/><path class="headfill" d="M314,460 l-11,-5.5 v11 z"/><text class="lbl" x="205.0" y="452" text-anchor="middle"><tspan class="num">18  </tspan>Review campaign + findings plan</text><line class="msg" x1="326" y1="490" x2="545" y2="490"/><path class="headfill" d="M554,490 l-11,-5.5 v11 z"/><text class="lbl" x="440.0" y="482" text-anchor="middle"><tspan class="num">19  </tspan>stream 3D model; edit campaign/plan</text><line class="msg" x1="96" y1="520" x2="305" y2="520"/><path class="headfill" d="M314,520 l-11,-5.5 v11 z"/><text class="lbl" x="205.0" y="512" text-anchor="middle"><tspan class="num">20  </tspan>Findings plan → <tspan class="mono">Ready</tspan>: next mission</text></svg>